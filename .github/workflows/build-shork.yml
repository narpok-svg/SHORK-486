name: Build SHORK 486 disk image

on:
  workflow_dispatch:

env:
  CROSS_TGZ: i486-linux-musl-cross.tgz
  CROSS_SHA256: 1b7eceb2022f4a664028dd314c5c44332b601bd271e40f0934b4bc8fd3b0fcf5

jobs:
  build:
    name: Build (Debian trixie container)
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show free disk space
        run: df -h /

      - name: Generate build configuration (.env)
        run: bash ci/gen-env.sh shork-486/config.sh shork-486

      # musl.cc times out from GitHub-hosted runners, so the toolchain is
      # fetched from a release asset on this fork instead. build.sh skips its
      # own download when build/<cross>.tgz already exists.
      - name: Fetch cross toolchain
        run: |
          mkdir -p shork-486/build
          curl -fL --retry 3 --retry-delay 5 \
            -o "shork-486/build/$CROSS_TGZ" \
            "https://github.com/narpok-svg/SHORK-486/releases/download/toolchain-v1/$CROSS_TGZ"
          echo "$CROSS_SHA256  shork-486/build/$CROSS_TGZ" | sha256sum -c -

      # The build needs loop devices inside a privileged container; fail fast
      # here rather than hours into the build.
      - name: Verify loop device support
        run: |
          docker run --rm --privileged debian:trixie-slim \
            sh -c 'apt-get update -qq && apt-get install -y -qq util-linux >/dev/null && losetup -f'

      - name: Build SHORK 486 Default
        run: docker compose up --build --abort-on-container-exit

      - name: Show after-build report
        if: always()
        run: cat shork-486/images/report.txt || true

      - name: Upload disk image and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shork-486-images
          path: |
            shork-486/images/*.img
            shork-486/images/report.txt
          if-no-files-found: warn
          compression-level: 0
